name: OpenAPI specs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint
        run: npx --yes @redocly/cli lint screening-api-docs/api.json rent-reporting-api-docs/api.json

  breaking-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Partners generate clients from these files: v1 may only grow, breaking changes go to a new version.
      # Base files stay inside the workspace because the oasdiff action runs in a container that only mounts it.
      - name: Collect published specs from the base branch
        run: |
          mkdir -p base-specs
          git show "origin/${{ github.base_ref }}:screening-api-docs/api.json" > base-specs/screening.json
          git show "origin/${{ github.base_ref }}:rent-reporting-api-docs/api.json" > base-specs/rent-reporting.json

      - name: screening spec has no breaking change
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: base-specs/screening.json
          revision: screening-api-docs/api.json
          fail-on: ERR

      - name: rent reporting spec has no breaking change
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: base-specs/rent-reporting.json
          revision: rent-reporting-api-docs/api.json
          fail-on: ERR
